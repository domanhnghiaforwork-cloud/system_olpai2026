version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: olp_ai_kma_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    environment:
      - DATABASE_PATH=/app/data/olpai2026.db
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
      - JWT_SECRET_KEY=olp_ai_kma_2026_super_secret_jwt_key_secure_contest
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: olp_ai_kma_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - INTERNAL_BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=
    depends_on:
      - backend
    restart: unless-stopped


volumes:
  backend_data:
